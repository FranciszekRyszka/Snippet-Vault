# Publishes the marketing site in website/ to GitHub Pages.
#
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".
# After that, every push to main that touches website/ redeploys the site to
# https://<user>.github.io/Snippet-Vault/ (a project page — the app repo is
# unchanged; this only serves static files from website/).
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege for a Pages deploy: read the repo, write the Pages artifact,
# and mint the OIDC token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish (don't cancel a
# publish midway).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # enablement: true turns Pages on (Source = GitHub Actions) on the first
      # run via the API, so no manual repo setting is needed.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain static files — no build step. Upload the folder as-is.
      - name: Upload website/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
