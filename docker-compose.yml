# SnipVault sync server.
#
#   1. Copy .env.example to .env and set a strong SNIPVAULT_TOKEN.
#   2. docker compose up -d
#   3. Point each SnipVault desktop app at http://<this-host>:3000 with the token.
#
# By default this pulls the prebuilt image from GitHub Container Registry — no
# local build needed. To build from this repo's source instead, comment out the
# `image:` line and uncomment `build: .`.
#
# The library is stored in the named volume `snipvault-data`, so it survives
# container rebuilds and image updates.
#
# Logs go to stdout via the json-file driver (rotated), so any Docker log viewer
# — `docker logs -f snipvault`, Dozzle, etc. — can read them. Docker also runs a
# health check against /api/health, so `docker ps` shows the container's health.

services:
  snipvault:
    image: ghcr.io/franciszekryszka/snippet-vault:latest
    # build: .   # uncomment (and comment out `image:` above) to build locally
    container_name: snipvault
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Auth — set ONE of these in your .env (Docker Compose loads it automatically):
      #   * SNIPVAULT_TOKEN  — one shared library behind a single token (typical).
      #   * SNIPVAULT_TOKENS — multiple users, each with a private vault
      #                        ("alice:tokA,bob:tokB"); takes precedence if both set.
      # See .env.example for how to generate tokens. If NEITHER is set, the server
      # refuses every /api request (503) rather than exposing the library, so it's
      # never left open by accident.
      SNIPVAULT_TOKEN: ${SNIPVAULT_TOKEN:-}
      SNIPVAULT_TOKENS: ${SNIPVAULT_TOKENS:-}
    volumes:
      - snipvault-data:/app/data
    # Poll the DB-backed health endpoint. It's behind the token gate, so the
    # check sends the same token from the environment. Uses Node (always in the
    # image) instead of curl/wget, which the slim runtime image doesn't include.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{headers:{Authorization:'Bearer '+(process.env.SNIPVAULT_TOKEN||'')}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Keep logs bounded and in a format log viewers (Dozzle, etc.) can read.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: periodic consistent backups of the sync database. A tiny Alpine
  # container runs SQLite's online ".backup" (WAL-safe — never a torn copy) into
  # the host's ./backups/ folder once a day and keeps the newest ~14. Uncomment,
  # then `mkdir -p backups && docker compose up -d`. Point restic/Duplicati/etc.
  # at ./backups/. See docs/self-hosting.md → "Backing up the server".
  # backup:
  #   image: alpine:3
  #   container_name: snipvault-backup
  #   restart: unless-stopped
  #   depends_on:
  #     - snipvault
  #   volumes:
  #     - snipvault-data:/data          # same volume the server writes
  #     - ./backups:/backups            # host folder your backup tool watches
  #   entrypoint: ["/bin/sh", "-c"]
  #   command:
  #     - >
  #       apk add --no-cache sqlite >/dev/null &&
  #       while true; do
  #         ts=$$(date +%Y%m%d-%H%M%S);
  #         if sqlite3 /data/snippets.db ".backup '/backups/snipvault-$$ts.db'"; then
  #           echo "backup: /backups/snipvault-$$ts.db";
  #         else
  #           echo "backup failed";
  #         fi;
  #         ls -1t /backups/snipvault-*.db 2>/dev/null | tail -n +15 | xargs -r rm -f;
  #         sleep 86400;
  #       done

  # ---------------------------------------------------------------------------
  # Optional: HTTPS via a reverse proxy. Recommended once several users share one
  # box, or whenever the server is reachable beyond a trusted LAN. Pick EXACTLY
  # ONE of the three options below (Caddy / nginx / Traefik) — they all bind
  # ports 80/443, so only one can run at a time. For every option:
  #   * REMOVE the `ports:` mapping on the `snipvault` service above, so it's only
  #     reachable inside this compose network and the proxy is the public entry.
  #   * Point the desktop app at https://<your-domain> (no :3000).
  # All three forward the client IP in X-Forwarded-For, which the server's auth
  # rate-limiter uses to tell callers apart. See docs/self-hosting.md.

  # --- Option A: Caddy — automatic Let's Encrypt certificates, simplest. -------
  #   1. cp Caddyfile.example Caddyfile   and set your domain + email in it.
  #   2. docker compose up -d
  # caddy:
  #   image: caddy:2
  #   container_name: snipvault-caddy
  #   restart: unless-stopped
  #   depends_on:
  #     - snipvault
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data          # persisted certificates — don't lose this
  #     - caddy-config:/config
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  # --- Option B: nginx — you supply the certificates (e.g. via certbot). -------
  #   1. cp nginx.example.conf nginx.conf   and set your domain in it.
  #   2. Put fullchain.pem + privkey.pem in ./certs (obtain them with certbot or
  #      your own CA — nginx does NOT provision certs itself).
  #   3. docker compose up -d
  # nginx:
  #   image: nginx:1
  #   container_name: snipvault-nginx
  #   restart: unless-stopped
  #   depends_on:
  #     - snipvault
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  # --- Option C: Traefik — automatic Let's Encrypt via Docker labels. ----------
  #   1. Set your email below and your domain in the snipvault labels.
  #   2. Add the labels shown to the `snipvault` service above.
  #   3. docker compose up -d
  # traefik:
  #   image: traefik:v3
  #   container_name: snipvault-traefik
  #   restart: unless-stopped
  #   command:
  #     - "--providers.docker=true"
  #     - "--providers.docker.exposedbydefault=false"
  #     - "--entrypoints.web.address=:80"
  #     - "--entrypoints.websecure.address=:443"
  #     - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
  #     - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
  #     - "--certificatesresolvers.le.acme.email=you@example.com"
  #     - "--certificatesresolvers.le.acme.httpchallenge=true"
  #     - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
  #     - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - traefik-letsencrypt:/letsencrypt
  # For Traefik, add these labels to the `snipvault` service above (set the host):
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.snipvault.rule=Host(`snipvault.example.com`)"
  #     - "traefik.http.routers.snipvault.entrypoints=websecure"
  #     - "traefik.http.routers.snipvault.tls.certresolver=le"
  #     - "traefik.http.services.snipvault.loadbalancer.server.port=3000"

  # Optional: a lightweight web log viewer for this host's containers. Uncomment
  # to run it alongside SnipVault, then open http://<this-host>:8080. It reads the
  # Docker socket read-only. You typically run just one Dozzle per host, so skip
  # this if you already have one.
  # dozzle:
  #   image: amir20/dozzle:latest
  #   container_name: dozzle
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  snipvault-data:
  # Used only by the optional reverse-proxy services above, to persist issued
  # TLS certificates across restarts (Caddy, or Traefik's ACME store).
  caddy-data:
  caddy-config:
  traefik-letsencrypt:
