[package]
name = "snipvault"
version = "3.0.1"
description = "A code snippets library"
authors = ["SnipVault"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "snipvault_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }
dirs = "5"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

# OS credential store for the sync token, per platform so each build only pulls
# in its own backend (Windows Credential Manager / macOS Keychain / Linux Secret
# Service). If the store is unavailable (e.g. a headless Linux box), the code
# falls back to storing the token in config.json — see get/set_remote_config.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
