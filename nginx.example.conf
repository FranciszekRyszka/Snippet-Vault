# Example nginx config for fronting the SnipVault sync server with HTTPS.
#
# Copy this to `nginx.conf`, set your domain, then enable the commented `nginx`
# service in docker-compose.yml (and remove the `ports:` mapping on the
# `snipvault` service so nginx is the only public entrypoint).
#
# nginx does NOT obtain certificates itself — supply your own. The easiest route
# is certbot (Let's Encrypt); place the resulting fullchain.pem and privkey.pem
# in ./certs (mounted at /etc/nginx/certs). If you'd rather not manage certs by
# hand, use the Caddy or Traefik option instead — both automate this.

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    server_name snipvault.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name snipvault.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # A sync push can carry the whole library. The server accepts up to 25 MB,
    # so allow at least that here — nginx's 1 MB default would reject big syncs.
    client_max_body_size 32m;

    location / {
        # "snipvault" is the compose service name; 3000 is its internal port.
        proxy_pass http://snipvault:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Forward the client IP so the server's auth rate-limiter can tell
        # callers apart (it keys on the first X-Forwarded-For hop).
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
